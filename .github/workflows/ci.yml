name: ci

# Catches the kind of regressions the storefront branch hit three times
# in a row: dead imports, parse errors after merges, broken sidebar
# helpers, removed Stripe APIs. PR can't merge if build or tests fail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      # Dependency vulnerabilities — block on critical (actionable); surface
      # high without blocking (transitive highs are often unfixable and
      # shouldn't wedge every PR).
      - name: Audit (critical blocks)
        run: npm audit --audit-level=critical
      - name: Audit (high — informational)
        run: npm audit --audit-level=high || true

      # Type-check standalone first — gives a fast, focused error
      # message before the slower `next build` runs.
      - name: Type-check
        run: npx tsc --noEmit

      # ESLint — errors block, warnings don't (87 pre-existing warnings as of
      # 2026-09-17). Catches hook-rule and unused-import mistakes tsc misses.
      - name: Lint
        run: npm run lint -- --quiet

      # Vitest — pure-logic test suite. Hits the sidebar filter helper,
      # useWishlist store, /api routes, etc.
      - name: Tests
        run: npm test

      # `next build` doubles as a build sanity check. Skip env-dependent
      # page-data collection failures by stubbing the secrets we don't
      # have in CI; the build step itself only needs the code to
      # compile.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key
          NEXT_PUBLIC_APP_URL: https://stub.example.com
          STRIPE_SECRET_KEY: sk_test_stub
          STRIPE_WEBHOOK_SECRET: whsec_stub
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_stub
          RESEND_API_KEY: re_stub
          RESEND_FROM_EMAIL: ci@stub.example.com
          R2_ACCOUNT_ID: stub
          R2_ACCESS_KEY_ID: stub
          R2_SECRET_ACCESS_KEY: stub
          R2_BUCKET_NAME: stub
          NEXT_PUBLIC_R2_PUBLIC_URL: https://stub.r2.dev
          CRON_SECRET: stub

      # /store/* runs an ENFORCED CSP (src/lib/security/csp.ts); a
      # prerendered /store page would render blank. Fail instead.
      - name: Store routes stay dynamic
        run: node scripts/ci/check-store-dynamic.mjs

  # Playwright smoke against a dev server in local-store mode: no Supabase,
  # Stripe or R2, and data comes from e2e/fixtures/store-db.json (two listed,
  # priced beats). Covers /store rendering, the preview drawer and cart →
  # /store/checkout. The project and playlist detail tests skip here, because
  # those routes need Supabase.
  #
  # ENABLE_LOCAL_STORE is what tells the SPEC the store is seeded, not just the
  # server: with it set, storefront.spec.ts asserts the fixture's two beats and
  # FAILS on an empty catalogue instead of skipping. Expect 4 passed / 2
  # skipped here. If it ever reports more skips than that, the catalogue broke
  # — do not treat a green-with-skips run as a pass.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Load storefront fixture
        run: cp e2e/fixtures/store-db.json data/db.json

      - name: Playwright
        run: npm run e2e
        env:
          CI: 'true'
          ENABLE_LOCAL_STORE: 'true'
          # Public values the browser Supabase client needs in order to
          # construct at all. The server still uses the local store, because
          # there's no service-role key.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_stub

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Secret scanning — catch an accidentally committed key/token before it
  # ships. Runs in parallel with build-and-test; full history on push.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
